[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-bunker"
version = "0.4.1"
description = "Offline-first continuity kit — local copies of calendar, contacts, and documents when the cloud goes down"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Gollogly" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "duckdb>=1.1.0",
  "pyarrow>=18.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
  "click>=8.1.7",
  "cryptography>=43.0.0",
  "msal>=1.31.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "keyring>=25.0.0",
  "icalendar>=6.0.0",
  "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "bandit>=1.7.10",
  "pip-audit>=2.7.0",
]
installer = [
  "pyinstaller>=6.11.0",
]
mdns = [
  "zeroconf>=0.132.0",
]

[project.scripts]
bunker = "bunker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bunker --cov-fail-under=88"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["bunker"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "zeroconf.*", "msal.*", "fastapi.*", "uvicorn.*", "keyring.*", "icalendar.*", "fpdf.*"]
ignore_missing_imports = true