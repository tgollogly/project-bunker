[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-bunker"
version = "0.3.2"
description = "Resilient, offline-first DuckDB and P2P data engine for Project Bunker"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Thomas-Gollogly-Proprietary"
authors = [{ name = "Thomas Gollogly" }]
dependencies = [
  "duckdb>=1.1.0",
  "pyarrow>=18.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
  "click>=8.1.7",
  "cryptography>=43.0.0",
  "msal>=1.31.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]
mdns = [
  "zeroconf>=0.132.0",
]

[project.scripts]
bunker = "bunker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bunker --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["bunker"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "zeroconf.*", "msal.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true