name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Unit tests
        run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First-run smoke
        run: bash scripts/ci-smoke.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Bandit (report medium+)
        run: bandit -r src/bunker -ll -q --exit-zero
      - name: Bandit (fail on high)
        run: bandit -r src/bunker -lll -q
      - name: pip-audit
        run: pip-audit

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e ".[installer]"
          pip install -e ".[dev]"
          pytest -q
          ./scripts/build_windows_portable.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-windows-portable
          path: dist/portable/