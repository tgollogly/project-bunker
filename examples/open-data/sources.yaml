# Open-data demo ingest (optional). Not required for Bunker Continuity.
# Run: bunker --config examples/open-data/sources.yaml ingest-all

bunker:
  data_root: data
  cache_root: cache
  sync_root: .

sources:
  - id: usgs_earthquakes_day
    name: USGS Earthquake Feed (past day)
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
    format: geojson
    parser: usgs_earthquakes_day
    primary_key: _feature_id
    attribution: "Data courtesy of the U.S. Geological Survey"
    license_note: "USGS products are in the public domain; cite USGS as source."
    min_fetch_interval_seconds: 60
    duckdb_table: earthquakes
    parquet_partition: usgs/earthquakes/day

  - id: open_meteo_demo
    name: Open-Meteo forecast sample (London)
    url: https://api.open-meteo.com/v1/forecast?latitude=51.5072&longitude=-0.1276&hourly=temperature_2m&forecast_days=1
    format: json
    parser: open_meteo_demo
    primary_key: time
    attribution: "Weather data by Open-Meteo.com"
    license_note: "Open-Meteo API — see https://open-meteo.com/en/terms"
    min_fetch_interval_seconds: 300
    duckdb_table: weather_hourly
    parquet_partition: open_meteo/london/hourly