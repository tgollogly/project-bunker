<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Project Bunker</title>
  <desc id="desc">Keep working when the cloud goes down. Free and open source, MIT License.</desc>
  <defs>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0f1b2d"/>
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>

  <!-- Storm cloud (top-right, y ~60–190) -->
  <g transform="translate(980 38)" filter="url(#softShadow)">
    <ellipse cx="100" cy="42" rx="78" ry="36" fill="#6b7280"/>
    <ellipse cx="58" cy="58" rx="46" ry="32" fill="#9ca3af"/>
    <ellipse cx="142" cy="60" rx="50" ry="30" fill="#9ca3af"/>
    <ellipse cx="98" cy="76" rx="74" ry="28" fill="#6b7280"/>
    <path fill="#fbbf24" d="M100 78 L93 98 L100 95 L95 114 L115 92 L107 95 Z" opacity="0.95"/>
    <text x="52" y="112" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Cloud offline</text>
  </g>

  <!-- Bunker arch (left) -->
  <g filter="url(#softShadow)">
    <path fill="url(#concrete)" d="M80 520 L80 280 Q80 120 320 100 Q560 120 560 280 L560 520 Z"/>
    <path fill="#374151" d="M120 500 L120 300 Q120 180 320 165 Q520 180 520 300 L520 500 Z" opacity="0.35"/>
    <rect x="95" y="500" width="450" height="28" rx="4" fill="#9ca3af"/>
  </g>

  <!-- Heraldic shield on arch -->
  <g transform="translate(280 112)" filter="url(#softShadow)">
    <path fill="#2ec4a6" d="M38 0 C12 0 4 12 4 18 L4 50 C4 50 18 88 38 102 C58 88 72 50 72 50 L72 18 C72 12 64 0 38 0 Z"/>
    <path fill="#0f1b2d" opacity="0.22" d="M24 24 L52 24 L52 46 C52 46 44 64 38 70 C32 64 24 46 24 46 Z"/>
  </g>

  <!-- Laptop inside arch -->
  <g transform="translate(165 195)" filter="url(#softShadow)">
    <rect x="0" y="0" width="300" height="200" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="14" y="14" width="272" height="158" rx="6" fill="#0f172a"/>
    <g transform="translate(28 28)">
      <rect width="110" height="90" rx="4" fill="#1e3a5f"/>
      <text x="8" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Calendar</text>
      <g fill="#334155" stroke="#475569" stroke-width="0.5">
        <rect x="4" y="26" width="22" height="16" rx="2"/>
        <rect x="30" y="26" width="22" height="16" rx="2"/>
        <rect x="56" y="26" width="22" height="16" rx="2"/>
        <rect x="82" y="26" width="22" height="16" rx="2"/>
        <rect x="4" y="46" width="22" height="16" rx="2" fill="#2ec4a6" fill-opacity="0.35"/>
        <rect x="30" y="46" width="22" height="16" rx="2"/>
        <rect x="56" y="46" width="22" height="16" rx="2"/>
        <rect x="82" y="46" width="22" height="16" rx="2"/>
        <rect x="4" y="66" width="22" height="16" rx="2"/>
        <rect x="30" y="66" width="22" height="16" rx="2"/>
      </g>
    </g>
    <g transform="translate(150 28)">
      <rect width="110" height="90" rx="4" fill="#1e3a5f"/>
      <text x="8" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Contacts</text>
      <circle cx="18" cy="38" r="8" fill="#64748b"/>
      <rect x="32" y="32" width="60" height="6" rx="2" fill="#94a3b8"/>
      <rect x="32" y="42" width="45" height="4" rx="1" fill="#64748b"/>
      <circle cx="18" cy="58" r="8" fill="#64748b"/>
      <rect x="32" y="52" width="55" height="6" rx="2" fill="#94a3b8"/>
      <circle cx="18" cy="78" r="8" fill="#64748b"/>
      <rect x="32" y="72" width="50" height="6" rx="2" fill="#94a3b8"/>
    </g>
    <circle cx="250" cy="130" r="10" fill="#22c55e"/>
    <text x="218" y="134" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">OK</text>
    <rect x="-20" y="200" width="340" height="14" rx="4" fill="#475569"/>
    <path d="M130 214 L170 230 L300 230" fill="#64748b"/>
  </g>

  <!-- Broken link: upper corridor only (y &lt; 200); avoids title column x ≥ 560 below y 380 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M472 255 L520 168 L638 142 L722 118" stroke="#9ca3af" stroke-width="4"/>
    <path d="M730 115 L744 102 M730 115 L744 128" stroke="#ef4444" stroke-width="5"/>
    <path d="M752 113 L1010 92" stroke="#9ca3af" stroke-width="4" stroke-dasharray="12 14" opacity="0.75"/>
  </g>

  <!-- Title block: lower-right, left-aligned at x=560 -->
  <g transform="translate(560 500)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700">
      <tspan>Project </tspan><tspan fill="#2ec4a6">Bunker</tspan>
    </text>
    <text y="52" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">
      Keep working when the cloud goes down
    </text>
    <text y="92" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400">
      Free &amp; open source · MIT License
    </text>
  </g>
</svg>